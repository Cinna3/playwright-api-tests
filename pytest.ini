[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -q
    --html=reports/report.html
    --self-contained-html
    --tb=short

markers =
    smoke: fast checks that must always pass
    contract: response shape and schema guarantees
    negative: bad input and boundary conditions
    xfail_reason: documents a defect in the API under test

# xfail_strict = false means that if someone later fixes the API, these
# documented-defect tests turn into XPASS (unexpected pass) and simply report
# it, rather than failing the whole run. The information is not lost.
xfail_strict = false
